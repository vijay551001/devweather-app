version: '3.8'

services:
  # ⚡ Service 1: In-Memory Redis Cache Gateway
  weather-cache:
    image: redis:7-alpine
    container_name: weather-redis-cache
    ports:
      - "6379:6379"

  # 🛠️ Service 2: The Backend Node.js Caching API Engine
  weather-backend:
    container_name: weather-api
    build: ./backend
    ports:
      - "2000:2000"
    depends_on:
      - weather-cache

  # 🌐 Service 3: The Nginx Web Gateway & Proxy Router
  weather-proxy:
    image: nginx:alpine
    container_name: weather-web-proxy
    ports:
      - "82:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - weather-backend
