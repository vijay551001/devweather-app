<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevWeather Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 500px; margin: 60px auto; background: #e0f2fe; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; box-sizing: border-box; border: 1px solid #bae6fd; }
        button { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; font-weight: bold; display: none; }
        .db { background: #fef08a; color: #854d0e; }
        .cache { background: #bbf7d0; color: #166534; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌤️ DevWeather Cache Dashboard</h2>
        <input type="text" id="cityInput" placeholder="Enter city (bengaluru, london, newyork)...">
        <button onclick="getWeather()">Check Weather</button>
        <div id="result"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if(!city) return;

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = "none";

            try {
                const res = await fetch(`/api/weather/${city}`);
                const data = await res.json();

                if(data.error) {
                    resultDiv.className = "db";
                    resultDiv.textContent = data.error;
                } else {
                    resultDiv.className = data.source === "Redis Cache" ? "cache" : "db";
                    resultDiv.innerHTML = `Source: ${data.source}<br>Result: ${data.data}`;
                }
                resultDiv.style.display = "block";
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
